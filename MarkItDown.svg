<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="40" x2="1440" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2434"/>
      <stop offset="0.58" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="accent" x1="478" y1="203" x2="1113" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-100" y="-100" width="1800" height="1100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1312" cy="144" r="290" fill="#3377FF" fill-opacity="0.10"/>
  <circle cx="246" cy="772" r="250" fill="#8A7CFF" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="155" y="95" width="1290" height="710" rx="34" fill="#111722" stroke="#2B3546" stroke-width="2"/>
    <rect x="155" y="95" width="1290" height="72" rx="34" fill="#171F2C"/>
    <rect x="155" y="133" width="1290" height="34" fill="#171F2C"/>
    <circle cx="202" cy="131" r="10" fill="#FF665C"/>
    <circle cx="236" cy="131" r="10" fill="#FFBD44"/>
    <circle cx="270" cy="131" r="10" fill="#00CA4E"/>
    <text x="800" y="139" text-anchor="middle" fill="#8E9AAF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">markitdown — terminal</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="225" y="260" fill="#F4F7FB" font-size="64" font-weight="700" letter-spacing="-2">MarkItDown</text>
    <rect x="225" y="292" width="212" height="54" rx="27" fill="url(#accent)"/>
    <text x="331" y="328" text-anchor="middle" fill="white" font-size="25" font-weight="650">Python 3.14</text>
    <text x="225" y="402" fill="#AAB5C7" font-size="28">Documents in. Markdown out.</text>

    <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="28">
      <text x="225" y="488" fill="#6EA8FF">$</text>
      <text x="258" y="488" fill="#EEF3FA">markitdown report.pdf -o report.md</text>
      <text x="225" y="542" fill="#6EA8FF">$</text>
      <text x="258" y="542" fill="#EEF3FA">markitdown slides.pptx -o notes.md</text>
      <text x="225" y="596" fill="#6EA8FF">$</text>
      <text x="258" y="596" fill="#EEF3FA">markitdown --help</text>
      <rect x="552" y="574" width="14" height="30" rx="2" fill="#8A7CFF"/>
    </g>

    <g transform="translate(920 235)">
      <rect width="388" height="106" rx="22" fill="#192332" stroke="#324157"/>
      <text x="28" y="43" fill="#F3F6FB" font-size="25" font-weight="650">macOS installer</text>
      <text x="28" y="75" fill="#8E9AAF" font-size="19">managed env + global CLI</text>
      <circle cx="340" cy="53" r="24" fill="#202E42"/>
      <path d="M329 53l8 8 15-18" stroke="#6EA8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(920 365)">
      <rect width="388" height="106" rx="22" fill="#192332" stroke="#324157"/>
      <text x="28" y="43" fill="#F3F6FB" font-size="25" font-weight="650">Windows installer</text>
      <text x="28" y="75" fill="#8E9AAF" font-size="19">WinGet-aware + PATH setup</text>
      <circle cx="340" cy="53" r="24" fill="#202E42"/>
      <path d="M329 53l8 8 15-18" stroke="#8A7CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(920 518)">
      <text x="0" y="0" fill="#8E9AAF" font-size="18" font-weight="600" letter-spacing="1.8">SUPPORTED INPUTS</text>
      <g transform="translate(0 28)">
        <rect width="82" height="48" rx="14" fill="#1A2637"/><text x="41" y="31" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">PDF</text>
        <rect x="94" width="92" height="48" rx="14" fill="#1A2637"/><text x="140" y="31" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">DOCX</text>
        <rect x="198" width="92" height="48" rx="14" fill="#1A2637"/><text x="244" y="31" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">PPTX</text>
        <rect x="302" width="86" height="48" rx="14" fill="#1A2637"/><text x="345" y="31" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">XLSX</text>
        <rect y="62" width="88" height="48" rx="14" fill="#1A2637"/><text x="44" y="93" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">HTML</text>
        <rect x="100" y="62" width="80" height="48" rx="14" fill="#1A2637"/><text x="140" y="93" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">CSV</text>
        <rect x="192" y="62" width="84" height="48" rx="14" fill="#1A2637"/><text x="234" y="93" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">JSON</text>
        <rect x="288" y="62" width="100" height="48" rx="14" fill="#1A2637"/><text x="338" y="93" text-anchor="middle" fill="#DDE6F3" font-size="18" font-weight="650">+ more</text>
      </g>
    </g>

    <text x="225" y="710" fill="#718097" font-size="18">Python compatibility · packaging · CI · Docker · cross-platform installation</text>
    <text x="1320" y="756" text-anchor="end" fill="#718097" font-size="17">Independent modification of Microsoft MarkItDown</text>
  </g>
</svg>
